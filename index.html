<title>Mail maison</title>
<style>
  :root { color-scheme: light dark; --texte: #1f2328; --fond: #ffffff; --doux: #59636e; --lien: #0969da; }
  @media (prefers-color-scheme: dark) { :root { --texte: #e6edf3; --fond: #0d1117; --doux: #9198a1; --lien: #4493f8; } }
  body { margin: 0; background: var(--fond); color: var(--texte); font: 17px/1.6 system-ui, sans-serif; }
  main { max-width: 42rem; margin: 0 auto; padding: 3rem 1rem; }
  h1 { font-size: 1.8rem; margin: 0 0 1rem; } h2 { font-size: 1.2rem; margin-top: 2rem; }
  .note { color: var(--doux); } a { color: var(--lien); }
</style>
</head>
<body>
<main>
  <h1>Mail maison</h1>
  <p>Mail maison est un outil personnel : il aide son auteur à trier, ranger, résumer et nettoyer sa propre boîte Gmail, depuis son ordinateur.</p>
  <p>Ce n'est pas un service ouvert au public : personne d'autre que son auteur ne l'utilise ni ne peut s'y inscrire.</p>
  <p><a href="confidentialite.html">Politique de confidentialité</a></p>
</main>
</body>
</html>
